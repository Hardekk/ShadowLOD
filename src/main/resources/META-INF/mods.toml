modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Hardekk/ShadowLOD/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="shadowlod.png"
displayURL="https://github.com/Hardekk/ShadowLOD"
authors="${mod_authors}"
description='''${mod_description}'''
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="embeddium"
    mandatory=false
    versionRange="[0.3.0,)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="oculus"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
